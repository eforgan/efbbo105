<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="460" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Diagrama Altura-Velocidad (H-V) — Concepto sobre Agua</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#64748b">Diagrama ilustrativo y conceptual — NO usar para planificación real. Consultar el AFM/RFM oficial.</text>

  <!-- Axes -->
  <line x1="90" y1="400" x2="740" y2="400" stroke="#334155" stroke-width="2"/>
  <line x1="90" y1="400" x2="90" y2="80" stroke="#334155" stroke-width="2"/>
  <text x="415" y="435" text-anchor="middle" font-size="15" fill="#0f172a">Velocidad Indicada (KIAS)</text>
  <text x="35" y="240" text-anchor="middle" font-size="15" fill="#0f172a" transform="rotate(-90 35 240)">Altura AGL (ft)</text>

  <!-- Avoid zone (low speed) -->
  <path d="M 90,400 L 90,150 C 200,150 260,300 260,400 Z" fill="#fecaca" stroke="#dc2626" stroke-width="1.5" opacity="0.85"/>
  <!-- Avoid zone (high speed, low altitude) -->
  <path d="M 560,400 L 560,370 C 650,370 740,385 740,400 Z" fill="#fecaca" stroke="#dc2626" stroke-width="1.5" opacity="0.85"/>

  <text x="150" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">ZONA</text>
  <text x="150" y="348" text-anchor="middle" font-size="13" font-weight="bold" fill="#7f1d1d">EVITADA</text>
  <text x="650" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f1d1d">ZONA EVITADA</text>

  <!-- Safe zone label -->
  <text x="420" y="200" text-anchor="middle" font-size="13" fill="#166534" font-weight="bold">ZONA SEGURA (autorrotación practicable)</text>

  <!-- Water-specific dashed reduced-margin line -->
  <path d="M 90,400 L 90,190 C 220,190 300,320 300,400 Z" fill="none" stroke="#0369a1" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="330" y="250" font-size="12" fill="#0369a1" font-weight="bold">Margen adicional recomendado sobre agua</text>
  <text x="330" y="268" font-size="12" fill="#0369a1">(menor tolerancia de flare / ausencia de superficie firme)</text>

  <!-- Axis ticks -->
  <text x="90" y="418" text-anchor="middle" font-size="11" fill="#475569">0</text>
  <text x="260" y="418" text-anchor="middle" font-size="11" fill="#475569">30</text>
  <text x="430" y="418" text-anchor="middle" font-size="11" fill="#475569">60</text>
  <text x="600" y="418" text-anchor="middle" font-size="11" fill="#475569">90</text>
  <text x="740" y="418" text-anchor="middle" font-size="11" fill="#475569">120 KIAS</text>

  <text x="78" y="400" text-anchor="end" font-size="11" fill="#475569">0</text>
  <text x="78" y="320" text-anchor="end" font-size="11" fill="#475569">200</text>
  <text x="78" y="240" text-anchor="end" font-size="11" fill="#475569">400</text>
  <text x="78" y="160" text-anchor="end" font-size="11" fill="#475569">600 ft</text>

  <!-- Legend -->
  <rect x="560" y="90" width="16" height="16" fill="#fecaca" stroke="#dc2626"/>
  <text x="582" y="103" font-size="12" fill="#0f172a">Zona evitada (genérica, terreno firme)</text>
  <rect x="560" y="115" width="16" height="4" fill="#0369a1"/>
  <text x="582" y="122" font-size="12" fill="#0f172a">Margen adicional recomendado sobre agua</text>
</svg>
