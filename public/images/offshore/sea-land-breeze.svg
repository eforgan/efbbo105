<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="420" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Brisa Marina y Brisa Terrestre</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#64748b">Diagrama conceptual — anticipar cambio de dirección de viento en horas de transición</text>

  <!-- DAY panel -->
  <g>
    <rect x="40" y="80" width="340" height="300" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="210" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">DÍA — Brisa Marina</text>
    <circle cx="330" cy="140" r="22" fill="#fbbf24"/>
    <!-- land -->
    <rect x="210" y="300" width="150" height="60" fill="#bbf7d0"/>
    <text x="285" y="335" text-anchor="middle" font-size="12" fill="#14532d">Tierra (más caliente)</text>
    <!-- sea -->
    <rect x="60" y="300" width="150" height="60" fill="#7dd3fc"/>
    <text x="135" y="335" text-anchor="middle" font-size="12" fill="#0c4a6e">Mar (más frío)</text>
    <!-- arrow sea -> land low level -->
    <path d="M 90,290 L 250,290" stroke="#0369a1" stroke-width="4" marker-end="url(#arrowBlueDay)"/>
    <text x="170" y="278" text-anchor="middle" font-size="12" fill="#0369a1" font-weight="bold">Viento superficial</text>
    <!-- rising air over land -->
    <path d="M 300,295 L 300,150" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRedDay)" stroke-dasharray="5,4"/>
    <text x="300" y="140" text-anchor="middle" font-size="11" fill="#dc2626">Aire cálido asciende</text>
  </g>

  <!-- NIGHT panel -->
  <g>
    <rect x="420" y="80" width="340" height="300" rx="10" fill="#0f172a" opacity="0.05"/>
    <rect x="420" y="80" width="340" height="300" rx="10" fill="none" stroke="#475569"/>
    <text x="590" y="106" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e293b">NOCHE — Brisa Terrestre</text>
    <circle cx="450" cy="140" r="16" fill="#cbd5e1"/>
    <!-- land -->
    <rect x="440" y="300" width="150" height="60" fill="#86efac"/>
    <text x="515" y="335" text-anchor="middle" font-size="12" fill="#14532d">Tierra (más fría)</text>
    <!-- sea -->
    <rect x="590" y="300" width="150" height="60" fill="#38bdf8"/>
    <text x="665" y="335" text-anchor="middle" font-size="12" fill="#0c4a6e">Mar (más cálido)</text>
    <!-- arrow land -> sea -->
    <path d="M 590,290 L 460,290" stroke="#0369a1" stroke-width="4" marker-end="url(#arrowBlueNight)"/>
    <text x="530" y="278" text-anchor="middle" font-size="12" fill="#0369a1" font-weight="bold">Viento superficial</text>
    <path d="M 630,295 L 630,150" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRedNight)" stroke-dasharray="5,4"/>
    <text x="630" y="140" text-anchor="middle" font-size="11" fill="#dc2626">Aire asciende sobre el mar</text>
  </g>

  <defs>
    <marker id="arrowBlueDay" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0369a1"/></marker>
    <marker id="arrowBlueNight" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#0369a1"/></marker>
    <marker id="arrowRedDay" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M0,10 L5,0 L10,10 Z" fill="#dc2626"/></marker>
    <marker id="arrowRedNight" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M0,10 L5,0 L10,10 Z" fill="#dc2626"/></marker>
  </defs>

  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#64748b">Anticipar la transición de brisa marina a terrestre (y viceversa) en amanecer/atardecer al planificar aproximaciones y despegues costeros.</text>
</svg>
