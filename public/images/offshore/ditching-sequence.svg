<svg viewBox="0 0 800 700" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="800" height="700" fill="#ffffff"/>
  <text x="400" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#0f172a">Secuencia de Amaraje Controlado (sin flotadores de fuselaje, con balsa)</text>
  <text x="400" y="52" text-anchor="middle" font-size="13" fill="#64748b">Diagrama conceptual de referencia — ver Módulo OF6 para el detalle completo</text>

  <defs>
    <marker id="arrDown" markerWidth="10" markerHeight="10" refX="5" refY="8" orient="auto"><path d="M0,0 L5,10 L10,0 Z" fill="#475569"/></marker>
  </defs>

  <!-- Step boxes -->
  <g font-size="14">
    <!-- 1 -->
    <rect x="220" y="75" width="360" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="400" y="103" text-anchor="middle" fill="#7f1d1d" font-weight="bold">1. Declarar emergencia (MAYDAY): posición, intención, ocupantes</text>
    <line x1="400" y1="121" x2="400" y2="141" stroke="#475569" stroke-width="2" marker-end="url(#arrDown)"/>

    <!-- 2 -->
    <rect x="220" y="142" width="360" height="46" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
    <text x="400" y="170" text-anchor="middle" fill="#713f12" font-weight="bold">2. Chalecos colocados y asegurados — SIN inflar</text>
    <line x1="400" y1="188" x2="400" y2="208" stroke="#475569" stroke-width="2" marker-end="url(#arrDown)"/>

    <!-- 3 -->
    <rect x="220" y="209" width="360" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="400" y="237" text-anchor="middle" fill="#1e3a8a" font-weight="bold">3. Orientar aproximación al viento / sentido de las olas</text>
    <line x1="400" y1="255" x2="400" y2="275" stroke="#475569" stroke-width="2" marker-end="url(#arrDown)"/>

    <!-- 4 -->
    <rect x="220" y="276" width="360" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="400" y="304" text-anchor="middle" fill="#1e3a8a" font-weight="bold">4. Reducir velocidad progresivamente, actitud controlada</text>
    <line x1="400" y1="322" x2="400" y2="342" stroke="#475569" stroke-width="2" marker-end="url(#arrDown)"/>

    <!-- 5 -->
    <rect x="180" y="343" width="440" height="52" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="400" y="365" text-anchor="middle" fill="#7f1d1d" font-weight="bold">5. Contacto con el agua</text>
    <text x="400" y="383" text-anchor="middle" fill="#7f1d1d" font-size="12">Sin flotadores de fuselaje — flotabilidad limitada y transitoria</text>
    <line x1="400" y1="395" x2="400" y2="415" stroke="#475569" stroke-width="2" marker-end="url(#arrDown)"/>

    <!-- 6 -->
    <rect x="180" y="416" width="440" height="46" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="400" y="444" text-anchor="middle" fill="#7f1d1d" font-weight="bold">6. EGRESO INMEDIATO — sin demora, punto de referencia fijo</text>
    <line x1="400" y1="462" x2="400" y2="482" stroke="#475569" stroke-width="2" marker-end="url(#arrDown)"/>

    <!-- 7 -->
    <rect x="220" y="483" width="360" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="400" y="511" text-anchor="middle" fill="#14532d" font-weight="bold">7. Inflar el chaleco recién FUERA de la aeronave</text>
    <line x1="400" y1="529" x2="400" y2="549" stroke="#475569" stroke-width="2" marker-end="url(#arrDown)"/>

    <!-- 8 -->
    <rect x="180" y="550" width="440" height="46" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="400" y="578" text-anchor="middle" fill="#1e3a8a" font-weight="bold">8. Médico aeroevacuador extrae e infla la balsa (6 pax)</text>
    <line x1="400" y1="596" x2="400" y2="616" stroke="#475569" stroke-width="2" marker-end="url(#arrDown)"/>

    <!-- 9 -->
    <rect x="220" y="617" width="360" height="46" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="400" y="645" text-anchor="middle" fill="#14532d" font-weight="bold">9. Activar PLB, agruparse, esperar rescate</text>
  </g>
</svg>
